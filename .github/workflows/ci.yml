# Lint and test. There is no compile or build step.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.2

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Install ShellCheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Shell
        run: |
          shellcheck deploy/deploy.sh deploy/raptorpath.sh deploy/copy.sh deploy/stage.sh
          shfmt -d deploy/deploy.sh deploy/raptorpath.sh deploy/copy.sh deploy/stage.sh

      - name: JavaScript syntax
        run: node --check js/main.js

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Unit tests
        run: python -m unittest discover -s server -v

      - name: Shell syntax
        run: bash -n deploy/deploy.sh deploy/raptorpath.sh deploy/copy.sh deploy/stage.sh

      - name: Deploy dry run
        run: ./deploy/deploy.sh --dry-run
