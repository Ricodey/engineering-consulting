# Deploy a published release by SSHing to the datum account.
# CF_EMAIL_TOKEN becomes the Podman secret datum-email. Deploy deletes /home/datum/form.env.
name: Deploy release

on:
  release:
    types: [published]

concurrency:
  group: datum-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: github.repository == 'Ricodey/engineering-consulting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS_VALUE: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_PORT}" ] || [ -z "${DEPLOY_SSH_KEY_VALUE}" ] || [ -z "${DEPLOY_SSH_KNOWN_HOSTS_VALUE}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CF_EMAIL_TOKEN}" ]; then
            echo "Set repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PORT, DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID, and CF_EMAIL_TOKEN." >&2
            exit 1
          fi
          if [ "${DEPLOY_USER}" != "datum" ]; then
            echo "DEPLOY_USER must be datum." >&2
            exit 1
          fi
          umask 077
          key="${RUNNER_TEMP}/deploy_key"
          known="${RUNNER_TEMP}/known_hosts"
          printf '%s\n' "${DEPLOY_SSH_KEY_VALUE}" >"${key}"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS_VALUE}" >"${known}"
          chmod 600 "${key}" "${known}"
          {
            printf 'DEPLOY_HOST=%q\n' "${DEPLOY_HOST}"
            printf 'DEPLOY_USER=%q\n' "${DEPLOY_USER}"
            printf 'DEPLOY_SSH_PORT=%q\n' "${DEPLOY_SSH_PORT}"
            printf 'DEPLOY_SSH_KEY=%q\n' "${key}"
            printf 'DEPLOY_SSH_KNOWN_HOSTS=%q\n' "${known}"
            printf 'CLOUDFLARE_API_TOKEN=%q\n' "${CLOUDFLARE_API_TOKEN}"
            printf 'CLOUDFLARE_ACCOUNT_ID=%q\n' "${CLOUDFLARE_ACCOUNT_ID}"
            printf 'CLOUDFLARE_ZONE_ID=%q\n' "${CLOUDFLARE_ZONE_ID}"
            printf 'CF_EMAIL_TOKEN=%q\n' "${CF_EMAIL_TOKEN}"
          } >deploy/deploy.env
          chmod 600 deploy/deploy.env
          ./deploy/deploy.sh

      - name: Remove deploy credentials
        if: always()
        run: |
          rm -f deploy/deploy.env
          rm -f "${RUNNER_TEMP:-}/deploy_key"
          rm -f "${RUNNER_TEMP:-}/known_hosts"
