map $http_cf_connecting_ip $raptorpath_client_ip {
    ""      $remote_addr;
    "~*^[0-9A-Fa-f:.]+$" $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 32k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location = /api/brief {
        proxy_pass http://127.0.0.1:4174/api/brief;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $raptorpath_client_ip;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4174/health;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
